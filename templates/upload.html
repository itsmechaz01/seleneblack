{% extends "base.html" %}
{% block title %}Upload - Selene Black{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-body p-4">
                <h2 class="text-center mb-4"><i class="bi bi-upload"></i> Upload Content</h2>
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="media" class="form-label">Media File</label>
                        <input type="file" class="form-control" id="media" name="media" accept="video/*,image/*" required>
                        <div class="form-text">Supported formats: MP4, MOV, AVI, JPG, PNG, GIF, WebP (max 500MB)</div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_premium" name="is_premium">
                        <label class="form-check-label" for="is_premium">
                            <i class="bi bi-lock-fill text-warning"></i> Premium content (subscribers only)
                        </label>
                    </div>
                    <button type="submit" class="btn btn-warning w-100">Upload</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
